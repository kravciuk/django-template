services:
  postgres:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: ${POSTGRES_INITDB_ARGS:-}
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./backups:/backup
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    build:
      context: .
      dockerfile: docker/redis/Dockerfile
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  django:
    build:
      context: .
      dockerfile: docker/django/Dockerfile.dev
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.dev
    env_file:
      - .env
    volumes:
      - ./src:/app
      - ./logs:/logs
      - ./var/media:/var/media
      - ./var/static:/var/static
      - ./scripts:/scripts
      - ./backups:/backup
      # pytest.ini and tests/ live at the project root, not under src/, so
      # without these `make test` (docker compose exec django pytest) and
      # CLAUDE.md's documented `pytest tests/unit/test_x.py::test_it -v`
      # both always collected 0 / failed to resolve the path - the
      # container had no way to see them. Mounting them under /app (rather
      # than e.g. at the container root) makes Docker create matching
      # empty placeholder entries back on the host under src/ - harmless,
      # just mount points - see .gitignore.
      - ./tests:/app/tests
      - ./pytest.ini:/app/pytest.ini
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: python manage.py runserver 0.0.0.0:8000

volumes:
  postgres_data:
  redis_data:
