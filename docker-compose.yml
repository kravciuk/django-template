# docker-compose.yml — DEV-окружение.
# Запуск: make dev-build && make dev-up (см. Makefile).

services:
  postgres:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    environment:
      # Официальный образ postgres/postgis ожидает именно POSTGRES_* при
      # инициализации кластера — берём значения из DB_* переменных .env.dev.
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: ${POSTGRES_INITDB_ARGS:-}
    env_file:
      - .env.dev
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./backups:/backup
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgbouncer:
    build:
      context: .
      dockerfile: docker/pgbouncer/Dockerfile
    environment:
      DB_HOST: ${POSTGRES_HOST}
      DB_PORT: ${POSTGRES_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      POOL_MODE: ${PGBOUNCER_POOL_MODE:-transaction}
      MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-100}
      AUTH_TYPE: scram-sha-256
    env_file:
      - .env.dev
    ports:
      - "6432:6432"
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    build:
      context: .
      dockerfile: docker/redis/Dockerfile
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  django:
    build:
      context: .
      dockerfile: docker/django/Dockerfile.dev
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.dev
    env_file:
      - .env.dev
    volumes:
      - ./src:/app
      - ./logs:/app/logs
      - ./var/media:/app/media
      - ./var/static:/app/static
      - ./scripts:/scripts
      - ./backups:/backup
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis:
        condition: service_started
    command: python manage.py runserver 0.0.0.0:8000

  celery-high:
    build:
      context: .
      dockerfile: docker/django/Dockerfile.dev
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.dev
      CELERY_QUEUE: high
    env_file:
      - .env.dev
    volumes:
      - ./src:/app
      - ./logs:/app/logs
      - ./scripts:/scripts
      - ./backups:/backup
    depends_on:
      - django
      - redis
    command: celery -A core worker -Q high --loglevel=info

  celery-low:
    build:
      context: .
      dockerfile: docker/django/Dockerfile.dev
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.dev
      CELERY_QUEUE: low
    env_file:
      - .env.dev
    volumes:
      - ./src:/app
      - ./logs:/app/logs
      - ./scripts:/scripts
      - ./backups:/backup
    depends_on:
      - django
      - redis
    command: celery -A core worker -Q low --loglevel=info

  celery-beat:
    build:
      context: .
      dockerfile: docker/django/Dockerfile.dev
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.dev
    env_file:
      - .env.dev
    volumes:
      - ./src:/app
      - ./logs:/app/logs
      - ./scripts:/scripts
      - ./backups:/backup
    depends_on:
      - django
      - redis
    command: celery -A core beat --loglevel=info

volumes:
  postgres_data:
  redis_data:
