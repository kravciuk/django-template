[databases]
* = host=postgres port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

pool_mode = transaction
max_client_conn = 100
default_pool_size = 20

# Аутентификация: userlist.txt генерируется entrypoint-скриптом базового
# образа edoburu/pgbouncer из переменных окружения DB_USER / DB_PASSWORD.
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
admin_users = postgres

logfile = /dev/stdout
