upstream django_backend {
    server django:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    # Proxied to Django, not aliased to a local /app/static/ - that directory
    # only exists here via docker/nginx/Dockerfile's `COPY --from=django_static
    # /app/static /app/static/`, a build-time snapshot of whatever the django
    # image's static files were when IT was last built. Dev containers mount
    # ./src live so source edits need no rebuild, but this image's own COPY
    # step doesn't - a JS/CSS change would never reach nginx here at all until
    # the image was rebuilt, no matter what caching headers said. Django
    # itself serves /static/ live from the same mounted ./src in DEBUG mode
    # (see core/urls.py's staticfiles_urlpatterns()), so proxying there
    # sidesteps the stale-bake problem entirely.
    location /static/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
    }

    location /media/ {
        alias /app/media/;
        access_log off;
    }

    # В DEV нет отдельного django-ws — WebSocket обслуживает тот же
    # django-контейнер (manage.py runserver уже ASGI, см. INSTALLED_APPS).
    location /ws/ {
        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
