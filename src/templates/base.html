<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Заметки{% endblock %}</title>
    {% block extra_head %}{% endblock %}
    <style>
        body {
            font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
            max-width: 720px;
            margin: 0 auto;
            padding: 1rem 1.5rem 3rem;
            color: #1a1a1a;
            line-height: 1.5;
        }
        a { color: #1155cc; }
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
            padding-bottom: 0.75rem;
            margin-bottom: 1.5rem;
        }
        nav .links a { margin-right: 1rem; }
        .note-entry {
            padding: 1rem 0;
            border-bottom: 1px solid #eee;
        }
        .note-entry-with-cover { display: flex; gap: 1rem; }
        .note-entry-cover { flex: 0 0 auto; }
        .note-entry-cover img { display: block; border-radius: 4px; object-fit: cover; }
        .note-entry-body { flex: 1 1 auto; min-width: 0; }
        .note-entry h2 { margin: 0 0 0.25rem; font-size: 1.1rem; }
        .note-meta, .note-excerpt { color: #555; margin: 0.25rem 0; }
        .note-body { margin-top: 1rem; }
        .note-actions { margin-top: 1.5rem; }
        .note-gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin: 1rem 0;
        }
        .note-gallery img { display: block; border-radius: 4px; object-fit: cover; }
        .note-gallery-fallback {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 200px;
            height: 150px;
            border-radius: 4px;
            background: #f0f0f0;
            color: #555;
            text-align: center;
            padding: 0.5rem;
            box-sizing: border-box;
        }
        .note-attachments { margin-top: 1rem; }
        .note-attachments ul { padding-left: 1.2rem; }
        form p { margin: 1rem 0; }
        form label { display: block; font-weight: 600; margin-bottom: 0.25rem; }
        form input[type=text], form select, form textarea { width: 100%; box-sizing: border-box; }
        .errorlist { color: #b00020; padding-left: 1.2rem; }
        .helptext { color: #777; font-size: 0.85rem; }
        button, input[type=submit] { padding: 0.5rem 1.25rem; cursor: pointer; }
        .tag-input {
            position: relative;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.35rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 0.4rem;
        }
        .tag-chips { display: flex; flex-wrap: wrap; gap: 0.35rem; }
        .tag-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            background: #eef2fb;
            border-radius: 3px;
            padding: 0.15rem 0.5rem;
            font-size: 0.9rem;
        }
        .tag-chip-remove {
            border: none;
            background: none;
            cursor: pointer;
            padding: 0;
            font-size: 1rem;
            line-height: 1;
            color: #555;
        }
        .tag-chip-remove:hover { color: #b00020; }
        .tag-text-input {
            flex: 1 1 8rem;
            border: none !important;
            outline: none;
            width: auto !important;
            min-width: 8rem;
            padding: 0.2rem !important;
        }
        .tag-suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            z-index: 10;
            margin: 0.2rem 0 0;
            padding: 0.25rem 0;
            list-style: none;
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
            max-height: 12rem;
            overflow-y: auto;
        }
        .tag-suggestions li { padding: 0.35rem 0.6rem; cursor: pointer; }
        .tag-suggestions li:hover { background: #eef2fb; }
    </style>
</head>
<body>
<nav>
    <a href="{% url 'content:home' %}"><strong>Заметки</strong></a>
    <a href="{% url 'documents:list' %}"><strong>Документы</strong></a>
    <span class="links">
        {% if user.is_authenticated %}
            {% if can_edit and note %}
                <a href="{% url 'content:note_add' %}?parent={{ note.public_id }}">Добавить заметку</a>
            {% else %}
                <a href="{% url 'content:note_add' %}">Добавить заметку</a>
            {% endif %}
            <a href="{% url 'documents:add' %}">Добавить документ</a>
            <span>{{ user }}</span>
        {% else %}
            <a href="/admin/login/?next={{ request.path }}">Войти</a>
        {% endif %}
    </span>
</nav>
{% block content %}{% endblock %}
</body>
</html>
