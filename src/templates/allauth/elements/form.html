{% comment %} djlint:off {% endcomment %}
{% load allauth %}
<form method="{{ attrs.method }}"
      {% if attrs.action %}action="{{ attrs.action }}"{% endif %}
      {% if attrs.id %}id="{{ attrs.id }}"{% endif %}
      novalidate>
    {% slot body %}
    {% endslot %}
    {% if slots.actions %}
        <div class="mt-3 d-flex gap-2 flex-wrap">
            {% slot actions %}
            {% endslot %}
        </div>
    {% endif %}
</form>
